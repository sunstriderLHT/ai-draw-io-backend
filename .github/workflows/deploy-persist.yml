name: Deploy backend persist branch

on:
  push:
    branches:
      - persist

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: xfg_frame_archetype
          MYSQL_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run the offline backend verification suite
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/xfg_frame_archetype?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 123456
          SUPABASE_ISSUER: https://test-project.invalid/auth/v1
          SUPABASE_JWKS_URI: http://127.0.0.1:9/jwks
          AI_MODEL_API_KEY: test-only-placeholder
        run: >-
          mvn -B -ntp -pl draw-io-front-harry-app -am -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=DependencySmokeTest,SupabaseSecurityTest,SupabaseClaimsValidatorTest,TrustedUserIdentityTest,AiQuotaServiceTest,MySqlAiQuotaRepositoryTest,MeteredSynchronousChatTest,MeteredStreamingChatTest,AiApiContractTest,AgentConfigSecretSafetyTest,QuotaReservationRecoveryJobTest,AgentStreamSubscriptionTest,AgentOutputEventMapperTest
          test
      - name: Package the production JAR
        run: mvn -B -ntp -DskipTests package
      - name: Upload the production JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-app-jar
          path: draw-io-front-harry-app/target/ai-agent-scaffold-app.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the validated production JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-app-jar
          path: draw-io-front-harry-app/target
      - name: Configure SSH
        env:
          BACKEND_PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.BACKEND_PRODUCTION_SSH_PRIVATE_KEY }}
          BACKEND_PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BACKEND_PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$BACKEND_PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload validated backend source
        env:
          BACKEND_PRODUCTION_HOST: ${{ secrets.BACKEND_PRODUCTION_HOST }}
          BACKEND_PRODUCTION_PORT: ${{ secrets.BACKEND_PRODUCTION_PORT }}
        run: |
          set -eu
          RELEASE="$GITHUB_SHA"
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -p $BACKEND_PRODUCTION_PORT"
          $SSH "backend-deploy@$BACKEND_PRODUCTION_HOST" "install -d -m 700 /home/backend-deploy/staging/$RELEASE"
          rsync -a --delete --info=progress2 --contimeout=30 --timeout=300 \
            --exclude '.git/' --exclude 'target/' --exclude '.worktrees/' \
            -e "$SSH" ./ "backend-deploy@$BACKEND_PRODUCTION_HOST:/home/backend-deploy/staging/$RELEASE/"
          $SSH "backend-deploy@$BACKEND_PRODUCTION_HOST" \
            "install -d -m 700 /home/backend-deploy/staging/$RELEASE/draw-io-front-harry-app/target"
          rsync -a --info=progress2 --contimeout=30 --timeout=300 -e "$SSH" \
            draw-io-front-harry-app/target/ai-agent-scaffold-app.jar \
            "backend-deploy@$BACKEND_PRODUCTION_HOST:/home/backend-deploy/staging/$RELEASE/draw-io-front-harry-app/target/"
          printf '%s\n' "$RELEASE" | $SSH "backend-deploy@$BACKEND_PRODUCTION_HOST" \
            'cat > /home/backend-deploy/staging/release'
      - name: Rebuild the backend on the production server
        env:
          BACKEND_PRODUCTION_HOST: ${{ secrets.BACKEND_PRODUCTION_HOST }}
          BACKEND_PRODUCTION_PORT: ${{ secrets.BACKEND_PRODUCTION_PORT }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ConnectionAttempts=2 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            -p "$BACKEND_PRODUCTION_PORT" "backend-deploy@$BACKEND_PRODUCTION_HOST" \
            'sudo /usr/local/sbin/deploy-drawio-backend'
