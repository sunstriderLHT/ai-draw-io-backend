services:
  backend:
    image: ${DRAWIO_BACKEND_IMAGE:?DRAWIO_BACKEND_IMAGE must be set}
    container_name: drawio-backend
    restart: unless-stopped
    env_file:
      - ${DRAWIO_BACKEND_ENV_FILE:-.env}
    expose:
      - "8091"
    volumes:
      - ./log:/data/log
    networks:
      - ingress
      - database
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress:
    external: true
    name: deploy_app
  database:
    external: true
    name: software_my-network
