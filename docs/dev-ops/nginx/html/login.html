<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Scaffold - 登录</title>
    <style>
      :root {
        --page: #090909;
        --surface: #f3f2ef;
        --surface-soft: #ffffff;
        --text: #151515;
        --muted: #686868;
        --line: #d8d7d4;
        --accent: #151515;
        --accent-deep: #151515;
        --danger: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100dvh;
        margin: 0;
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--page);
      }

      .page {
        height: 100dvh;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(380px, 0.75fr);
        overflow: hidden;
      }

      .intro {
        position: relative;
        height: 100dvh;
        overflow: hidden;
        background: #090909;
      }

      .intro::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.86));
      }

      .hero-image {
        width: 100%;
        height: 100dvh;
        object-fit: cover;
        object-position: center;
        opacity: 0.38;
        filter: grayscale(1) contrast(0.9);
      }

      .intro-copy {
        position: absolute;
        z-index: 1;
        left: clamp(32px, 7vw, 96px);
        right: clamp(32px, 7vw, 96px);
        bottom: clamp(36px, 8vh, 84px);
        max-width: 540px;
        color: #f5f5f3;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 7px;
        color: #f5f5f3;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(40px, 5vw, 72px);
        line-height: 1.08;
        letter-spacing: -0.055em;
      }

      .intro-copy p {
        max-width: 38ch;
        margin: 22px 0 0;
        color: #c8c8c8;
        font-size: 16px;
        line-height: 1.75;
      }

      .capabilities {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 26px;
      }

      .capabilities span {
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 7px;
        color: #e4e4e4;
        font-size: 13px;
      }

      .login-panel {
        display: grid;
        align-content: center;
        padding: clamp(32px, 7vw, 96px);
        background: var(--surface);
      }

      .login-box { max-width: 390px; }

      .login-box h2 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      .login-box > p {
        margin: 12px 0 30px;
        color: var(--muted);
        line-height: 1.65;
      }

      .field { margin-top: 18px; }

      label {
        display: block;
        margin-bottom: 8px;
        color: #383838;
        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 7px;
        outline: none;
        padding: 0 14px;
        color: var(--text);
        font: inherit;
        background: var(--surface-soft);
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input::placeholder { color: #8a8a8a; }
      input:focus { border-color: #151515; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08); }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 28px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        background: #151515;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover { background: #303030; }
      button:active { transform: translateY(1px); }

      .message {
        min-height: 22px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .message[data-state="error"] { color: var(--danger); }
      .message[data-state="success"] { color: #24704c; }

      .demo-hint {
        margin: 24px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .demo-hint code { color: #151515; font-family: Consolas, monospace; }

      @media (max-width: 820px) {
        .page { height: auto; min-height: 100dvh; grid-template-columns: 1fr; overflow: visible; }
        .intro { min-height: 48dvh; }
        .hero-image { min-height: 48dvh; }
        .intro-copy { bottom: 34px; }
        h1 { max-width: 12ch; font-size: clamp(36px, 9vw, 54px); }
        .login-panel { min-height: 52dvh; padding: 42px 24px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-label="AI 智能体介绍">
        <img class="hero-image" src="ai-agent-hero.png" alt="由绿色数据光线构成的 AI 智能体" />
        <div class="intro-copy">
          <div class="brand"><span class="brand-mark">AI</span> AI Agent Scaffold</div>
          <h1>把任务交给智能体</h1>
          <p>连接模型、工具和工作流，让智能体在可观测的执行链路中完成实际工作。</p>
          <div class="capabilities" aria-label="核心能力">
            <span>多模型路由</span>
            <span>工具调用</span>
            <span>工作流编排</span>
          </div>
        </div>
      </section>

      <section class="login-panel" aria-label="登录区域">
        <div class="login-box">
          <h2>欢迎回来</h2>
          <p>登录后进入 AI 智能体工作台。</p>
          <form id="loginForm" novalidate>
            <div class="field">
              <label for="username">账号</label>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
            </div>
            <button type="submit">登录工作台</button>
            <p id="formMessage" class="message" role="status" aria-live="polite"></p>
          </form>
          <p class="demo-hint">演示账号：<code>admin</code>，密码：<code>admin</code></p>
        </div>
      </section>
    </main>

    <script>
      const cookieName = 'ai_agent_login';

      function setLoginCookie(username) {
        const payload = encodeURIComponent(JSON.stringify({ user: username, ts: Date.now() }));
        document.cookie = `${cookieName}=${payload}; Max-Age=604800; Path=/; SameSite=Lax`;
        localStorage.setItem(cookieName, JSON.stringify({ user: username, ts: Date.now() }));
      }

      function hasLoginCookie() {
        return document.cookie.split('; ').some((item) => item.startsWith(`${cookieName}=`)) || Boolean(localStorage.getItem(cookieName));
      }

      const message = document.getElementById('formMessage');

      if (hasLoginCookie()) window.location.replace('./index.html');

      document.getElementById('loginForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
          message.textContent = '请输入账号和密码。';
          message.dataset.state = 'error';
          return;
        }

        if (username !== 'admin' || password !== 'admin') {
          message.textContent = '账号或密码不正确，请使用演示账号。';
          message.dataset.state = 'error';
          return;
        }

        setLoginCookie(username);
        message.textContent = '登录成功，正在进入工作台。';
        message.dataset.state = 'success';
        window.location.replace('./index.html');
      });
    </script>
  </body>
</html>
